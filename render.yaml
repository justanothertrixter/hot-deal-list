services:
  - type: web
    name: hot-deal-list
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: HOTDEAL_SECRET
        generateValue: true
