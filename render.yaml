services:
  - type: web
    name: hot-deal-list
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: HOTDEAL_SECRET
        generateValue: true
      # list.am блокирует IP дата-центров -> на Render скрапер не работает.
      # Каталог обновляется с Mac (резидентный IP) через sync_render.sh,
      # который пушит hot_deals.db в GitHub, а Render передеплоивается.
      - key: HOTDEAL_DISABLE_SCHEDULER
        value: "1"
      - key: TZ
        value: Asia/Yerevan
